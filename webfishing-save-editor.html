<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tackle Box · WEBFISHING save editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1c24; --surface:#162832; --surface2:#1e3643; --line:#33505f; --text:#e9f2ee; --muted:#9bb2b8;
  --accent:#ff5a3c; --accent-ink:#1b0a06; --water:#58c7cf; --good:#8fd68a; --warn:#ffcf5c; --bad:#ff8a7a;
  --r0:#a7b6b2; --r1:#6ec6ff; --r2:#7ee0a1; --r3:#c9a0ff; --r4:#ffd166; --r5:#ff7a8a;
  --shadow:0 0 0 2px var(--line);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#e7f0ee; --surface:#fbfdfc; --surface2:#dcebe8; --line:#8fb0aa; --text:#122428; --muted:#4d666c;
  --accent:#d63a1c; --accent-ink:#ffffff; --water:#0f7f89; --good:#2c7a34; --warn:#8a6100; --bad:#b3261e;
  --r0:#6d7f7b; --r1:#1b78b8; --r2:#25825a; --r3:#7a45c2; --r4:#a87400; --r5:#c4304a; color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e7f0ee; --surface:#fbfdfc; --surface2:#dcebe8; --line:#8fb0aa; --text:#122428; --muted:#4d666c;
    --accent:#d63a1c; --accent-ink:#ffffff; --water:#0f7f89; --good:#2c7a34; --warn:#8a6100; --bad:#b3261e;
    --r0:#6d7f7b; --r1:#1b78b8; --r2:#25825a; --r3:#7a45c2; --r4:#a87400; --r5:#c4304a; color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.brand-name,.btn,.nav,.drop-title{font-family:"Pixelify Sans","Atkinson Hyperlegible",system-ui,sans-serif}
h1{font-size:30px;line-height:1.15;margin:0 0 4px;font-weight:600}
h2{font-size:22px;margin:0;font-weight:600}
h3{font-size:18px;margin:0 0 10px;font-weight:600}
h4{font-size:16px;margin:14px 0 6px}
p{margin:0 0 10px}
code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.88em}
.muted{color:var(--muted)} .small{font-size:13px} .warn{color:var(--warn)}
a{color:var(--water)}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
img.ic{width:32px;height:32px;image-rendering:pixelated;object-fit:contain;flex:none}
img.ic.big{width:44px;height:44px;padding:4px;background:#22363f;border-radius:2px} img.ic.huge{width:72px;height:72px;padding:6px;background:#22363f;border-radius:2px}
.ic-missing{display:inline-grid;place-items:center;width:44px;height:44px;border:2px dashed var(--line);color:var(--muted)}

/* pixel-notched surfaces: the one signature */
.px{box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line);background:var(--surface);margin:2px}

#app{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand-name{font-size:20px;font-weight:700;letter-spacing:.2px}
.brand.big .brand-name{font-size:26px}
.bobber{width:18px;height:18px;border-radius:50%;background:linear-gradient(var(--accent) 0 50%,#f6f6f2 50% 100%);border:2px solid var(--text);box-shadow:0 5px 0 -1px var(--water)}
.spacer{flex:1}
.filechips{display:flex;gap:8px;flex-wrap:wrap}
.filechip{display:inline-flex;gap:8px;align-items:center;padding:3px 6px 3px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:3px;font-size:13px}
.filechip .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:12px}
.filechip .x:hover{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
.fname{font-weight:600;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{font-size:15px;padding:7px 14px;color:var(--text);background:var(--surface2);border:0;cursor:pointer;box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line);margin:2px}
.btn:hover:not(:disabled){background:var(--line)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary,.btn.accent{background:var(--accent);color:var(--accent-ink);box-shadow:0 -2px 0 0 var(--accent),0 2px 0 0 var(--accent),-2px 0 0 0 var(--accent),2px 0 0 0 var(--accent)}
.btn.primary:hover:not(:disabled),.btn.accent:hover:not(:disabled){filter:brightness(1.1);background:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--surface2)}
.btn.danger{color:var(--bad)} .btn.primary.danger{color:var(--accent-ink)}
.btn.small{font-size:13px;padding:4px 10px}

.body{display:flex;flex:1;min-height:0}
.side{width:220px;flex:none;padding:14px 10px;border-right:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;font-size:16px;padding:8px 10px;color:var(--text);background:none;border:0;cursor:pointer;border-left:4px solid transparent}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--surface2);border-left-color:var(--accent);font-weight:700}
.chg{width:9px;height:9px;background:var(--accent);border-radius:50%;flex:none}
.count{background:var(--accent);color:var(--accent-ink);font-size:12px;padding:0 7px;border-radius:9px;font-family:system-ui}
.side-sep{height:2px;background:var(--line);margin:10px 4px}
.side-foot{margin-top:auto;padding-top:14px}
main{flex:1;min-width:0;padding:22px 26px 60px;overflow:auto}
.page{max-width:1000px;margin:0 auto} .page.wide{max-width:1320px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .row.end{justify-content:flex-end;margin-top:12px}
.row.end-align{align-items:flex-end}
.grow{flex:1;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start;margin:6px 0 18px}
.cols.cos{grid-template-columns:300px 1fr}
.card{padding:16px 18px;margin-bottom:16px}
.cols .card{margin-bottom:0}

.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.field .lbl{font-weight:700;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.field.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=search],select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:2px;padding:6px 8px;min-height:36px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.numwrap{display:flex;flex-direction:column;gap:6px}
.numwrap.changed input[type=number],.numwrap.changed input[type=text]{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;margin:4px 0}
.check.big{padding:6px 0;font-size:15px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0} .facts dt{color:var(--muted)} .facts dd{margin:0;word-break:break-word}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.toolbar .search{max-width:300px}
.toolbar select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;padding:4px 12px;border-radius:2px;border:2px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.chip:hover{background:var(--surface2)} .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)} .chip.static{cursor:default;font-size:12px;padding:1px 8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:inherit;font-size:13px;padding:3px 10px;background:var(--bg);border:2px solid var(--line);color:var(--muted);cursor:pointer;border-radius:2px}
.pill.on{background:currentColor;border-color:currentColor} .pill.on{color:var(--bg)}
.pill.r0.on,.pill.r1.on,.pill.r2.on,.pill.r3.on,.pill.r4.on,.pill.r5.on{color:var(--bg)}
.pill:not(.on):hover{border-color:var(--text);color:var(--text)}
.pill.r0{--c:var(--r0)} .pill.r1{--c:var(--r1)} .pill.r2{--c:var(--r2)} .pill.r3{--c:var(--r3)} .pill.r4{--c:var(--r4)} .pill.r5{--c:var(--r5)}
.pill[class*=" r"]:not(.on){border-color:var(--c);color:var(--c)}
.pill[class*=" r"].on{background:var(--c);border-color:var(--c);color:var(--bg)}
.pill.on:not([class*=" r"]){background:var(--text);border-color:var(--text);color:var(--bg)}

.split{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.detail{padding:16px;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.empty{color:var(--muted);padding:20px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.grid.lures{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tile{position:relative;padding:0;display:flex;flex-direction:column;text-align:center;font:inherit;color:var(--text);cursor:pointer;border:0;min-width:0}
.tile>.tile-main,.tile.px:not(:has(.tile-main)){all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px 8px;flex:1;min-width:0}
.tile>.tile-main:focus-visible{outline:3px solid var(--water);outline-offset:-3px}
.tile-name{font-size:13px;line-height:1.2;font-weight:700;word-break:break-word}
.tile-sub{font-size:12px;line-height:1.2;min-height:1em}
.tile:hover{background:var(--surface2)}
.tile.open{background:var(--surface2);box-shadow:0 -2px 0 0 var(--accent),0 2px 0 0 var(--accent),-2px 0 0 0 var(--accent),2px 0 0 0 var(--accent)}
.tile.sel{outline:3px dashed var(--water);outline-offset:1px}
.tile.missing img.ic{filter:grayscale(1) brightness(.6);opacity:.65} .tile.missing .tile-name{color:var(--muted)}
.tile.unknown .tile-name{font-style:italic}
.tile-check{position:absolute;top:6px;left:6px;z-index:2;opacity:.0;width:18px;height:18px}
.tile:hover .tile-check,.tile-check:focus-visible,.tile.sel .tile-check{opacity:1}
.tile-flags{position:absolute;top:5px;right:6px;display:flex;gap:3px;font-size:12px}
.tile.r1{box-shadow:0 -2px 0 0 var(--r1),0 2px 0 0 var(--r1),-2px 0 0 0 var(--r1),2px 0 0 0 var(--r1)}
.tile.r2{box-shadow:0 -2px 0 0 var(--r2),0 2px 0 0 var(--r2),-2px 0 0 0 var(--r2),2px 0 0 0 var(--r2)}
.tile.r3{box-shadow:0 -2px 0 0 var(--r3),0 2px 0 0 var(--r3),-2px 0 0 0 var(--r3),2px 0 0 0 var(--r3)}
.tile.r4{box-shadow:0 -2px 0 0 var(--r4),0 2px 0 0 var(--r4),-2px 0 0 0 var(--r4),2px 0 0 0 var(--r4)}
.tile.r5{box-shadow:0 -2px 0 0 var(--r5),0 2px 0 0 var(--r5),-2px 0 0 0 var(--r5),2px 0 0 0 var(--r5)}
.stamps{display:flex;gap:3px;margin-top:2px}
.stamps i{width:9px;height:9px;border:1.5px solid var(--c);opacity:.5}
.stamps i.on{background:var(--c);opacity:1}
.stamps .r0{--c:var(--r0)} .stamps .r1{--c:var(--r1)} .stamps .r2{--c:var(--r2)} .stamps .r3{--c:var(--r3)} .stamps .r4{--c:var(--r4)} .stamps .r5{--c:var(--r5)}
.mini{font:inherit;font-size:12px;border:0;border-top:2px solid var(--line);background:none;color:var(--muted);padding:4px;cursor:pointer;width:100%}
.mini:hover{background:var(--line);color:var(--text)}
.lure .check{padding:0 8px 8px;justify-content:center}
.lure .tile-main{padding-bottom:4px}

.hotbar-wrap{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.hotbar{display:flex;gap:8px}
.slot{width:62px;height:62px;display:grid;place-items:center;border:0;color:var(--text);cursor:pointer;position:relative;font:inherit}
.slot:hover{background:var(--surface2)} .slot.filled{background:var(--surface2)}
.slot-n{position:absolute;top:2px;left:6px;font-size:11px;color:var(--muted)}
.bulk{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin:0 2px 12px;background:var(--surface2)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:12px}
.tab{font:inherit;font-size:16px;display:flex;gap:8px;align-items:baseline;padding:8px 14px;background:none;border:0;color:var(--text);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;font-family:"Pixelify Sans",system-ui,sans-serif}
.tab.on{border-bottom-color:var(--accent);font-weight:700;background:var(--surface)}
.tab:hover{background:var(--surface2)}

.equip{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.cos-right .chips{margin-bottom:8px}
.note{padding:8px 12px;border-left:4px solid var(--warn);background:var(--surface);margin:0 0 12px}
.row-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row-item:last-child{border:0} .row-item .numwrap{width:110px}

.quest .qhead{display:flex;justify-content:space-between;gap:8px;align-items:start}
.bar{height:12px;background:var(--bg);border:2px solid var(--line);margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--water)}
ul.plain{margin:8px 0 0;padding-left:18px;columns:2}

.changes{list-style:none;margin:0;padding:0}
.crow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crow:last-child{border:0} .cpath{font-weight:700} .cval{text-align:right}
.from{color:var(--bad)} .to{color:var(--good)}
.crow.removed .cpath{text-decoration:line-through;text-decoration-thickness:1px}

.tree{font-size:14px}
.tnode{margin-left:0} .tchildren{margin-left:16px;border-left:2px solid var(--line);padding-left:10px}
.tnode>summary{cursor:pointer;padding:3px 0;display:flex;gap:10px;align-items:baseline;list-style-position:inside}
.tnode.leaf{display:grid;grid-template-columns:minmax(120px,220px) 54px 1fr;gap:8px;align-items:center;padding:2px 0}
.tnode.leaf input[type=text],.tnode.leaf input[type=number]{min-height:30px;padding:2px 6px}
.tkey{font-weight:700;word-break:break-all} .ttype{color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace}

.overlay{position:fixed;inset:0;background:rgba(5,12,16,.66);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(520px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--surface)}
.modal.wide{width:min(900px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid var(--line)}
.modal-body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.scroll{max-height:42vh;overflow:auto;padding:4px}
.addform{border-top:2px solid var(--line);padding-top:10px}
.addform .field{margin:0;width:100px} .addform .field.wide{width:auto}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:8px 16px;border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .3s}
.toast.bad{background:var(--bad);color:#1a0705} .toast.out{opacity:0}
#veil{position:fixed;inset:0;z-index:90;background:rgba(15,28,36,.86);display:none;place-items:center;font:700 30px "Pixelify Sans",system-ui;color:#fff;border:6px dashed var(--accent);margin:10px;pointer-events:none}
#veil.on{display:grid}
#theme{position:fixed;right:12px;bottom:12px;z-index:30;opacity:.75;font-size:13px}
#theme:hover{opacity:1}

/* landing */
.landing{max-width:860px;margin:0 auto;padding:44px 24px 60px}
.land-hero h1{font-size:42px;max-width:18ch;margin:22px 0 10px}
.lede{font-size:18px;color:var(--muted);max-width:56ch;margin-bottom:24px}
.drop{padding:40px 24px;text-align:center;cursor:pointer;border:0;border-radius:0;background:var(--surface);outline-offset:6px;margin:2px}
.drop:hover,.drop:focus-visible{background:var(--surface2)}
.drop-title{font-size:26px;margin-bottom:4px}
.drop-types{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.drop-types code{background:var(--bg);padding:2px 8px;border:1px solid var(--line)}
.where{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 16px;margin-top:18px;flex-wrap:wrap}
.where-lbl{font-size:13px;color:var(--muted)} .path{word-break:break-all;font-size:14px}
.steps{margin:30px 0 0;padding-left:22px;display:grid;gap:12px;max-width:62ch}

@media (max-width:900px){
  .body{flex-direction:column} .side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--line)}
  .side-foot{display:none} .side-sep{display:none}
  .nav{width:auto;border-left:0;border-bottom:4px solid transparent} .nav.on{border-bottom-color:var(--accent)}
  main{padding:16px 14px 60px} .split{grid-template-columns:1fr} .detail{position:static;max-height:none}
  .cols.cos{grid-template-columns:1fr} .land-hero h1{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.cval.left{text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<div id="veil">Drop to open</div>
<button id="theme" class="btn ghost small" type="button" aria-label="Switch light or dark theme">Light / dark</button>
<input id="picker" type="file" accept=".sav,.backup" multiple hidden>

/* ---------- node helpers ---------- */
const N = {

  real: (v) => ({ t: 'real', f: Math.fround(v) === v ? 0 : 1, v }),
  str: (v) => ({ t: 'str', f: 0, v }),
  bool: (v) => ({ t: 'bool', f: 0, v }),

/* ---------- diff ---------- */

    button('Revert every change', () => confirmBox('Revert all changes?', 'Every edit since you opened the files is discarded.', 'Revert', () => { for (const fk of ['save', 'general']) { const f = S.files[fk]; if (f) f.root = clone(f.orig); } S.undo = []; S.redo = []; render(); toast('Reverted to the files as you opened them'); }, true), 'ghost danger', { disabled: !list.length }));
  const cmpInput = h('input', { type: 'file', accept: '.sav,.backup', hidden: true, onchange: async (e) => { const file = e.target.files[0]; if (!file) return; try { const { root } = parseFile(new Uint8Array(await file.arrayBuffer())); S.compare = { name: file.name, root }; renderMain(); } catch (err) { toast('Could not read that file: ' + err.message, 'bad'); } } });
  return h('div', { class: 'page' }, pageHead('Review changes', list.length ? 'Check these before you download. Nothing is written until you do.' : 'You have not changed anything yet.'), actions,
    list.length ? [...groups.entries()].map(([k, items]) => { const [fk] = k.split(':'); const f = S.files[fk];
      return h('section', { class: 'card px' }, h('h3', null, (TOP_NAMES[items[0].path[0]] || prettyId(items[0].path[0])) + ' ', h('span', { class: 'muted small' }, items.length + (items.length === 1 ? ' change' : ' changes') + (fk === 'general' ? ' in settings' : ''))),
        h('ul', { class: 'changes' }, changeRows(items.slice(0, 200), f.orig, f.root)), items.length > 200 ? h('p', { class: 'muted small' }, 'Showing the first 200 of ' + items.length + '.') : null);
    }) : null,
    card('Compare with another save', h('p', { class: 'muted' }, 'Load your .backup (or any older save) to see what differs from your current edited save.'),
      h('div', { class: 'row' }, button('Choose file to compare', () => cmpInput.click()), cmp ? button('Clear', () => { S.compare = null; renderMain(); }, 'ghost') : null), cmpInput,
      cmp ? [h('h4', null, cmp.name + ' → current: ' + cmpList.length + ' differences'), h('ul', { class: 'changes' }, changeRows(cmpList.slice(0, 300), cmp.root, S.files.save.root)), cmpList.length > 300 ? h('p', { class: 'muted small' }, 'Showing the first 300.') : null] : null));
}

/* ================= raw ================= */
function RawView() {
  const roots = ['save', 'general'].filter(k => S.files[k]);
  const sel = S.rawFile && S.files[S.rawFile] ? S.rawFile : roots[0]; S.rawFile = sel; const f = S.files[sel];
  const filter = h('input', { type: 'search', class: 'search', placeholder: 'Jump to a top-level key', 'aria-label': 'Filter keys', value: S.rawQ || '', oninput: (e) => { S.rawQ = e.target.value; fill(); } });
  const host = h('div', { class: 'tree' });
  const scalar = (n, path, label) => {
    const set = (fn) => commit(sel, 'Edit ' + label, fn, { render: false, merge: true });
    let inp;
    if (n.t === 'bool') inp = h('input', { type: 'checkbox', checked: n.v, onchange: (e) => set(() => { n.v = e.target.checked; }) });
    else if (n.t === 'str') inp = h('input', { type: 'text', value: n.v, onchange: (e) => set(() => { n.v = e.target.value; }) });
    else if (n.t === 'int') inp = h('input', { type: 'text', inputmode: 'numeric', value: String(n.v), onchange: (e) => { try { const b = BigInt(e.target.value.trim()); set(() => setNum(n, (b >= -MAXS && b <= MAXS) ? Number(b) : b)); } catch (_) { e.target.value = String(n.v); toast('Whole numbers only', 'bad'); } } });
    else if (n.t === 'real') inp = h('input', { type: 'number', step: 'any', value: cleanReal(n), onchange: (e) => { const x = parseFloat(e.target.value); isFinite(x) ? set(() => setNum(n, x)) : (e.target.value = cleanReal(n)); } });
    else if (n.t === 'vec2') inp = h('span', null, describeNode(n));
    else inp = h('span', { class: 'muted' }, 'empty');
    return h('div', { class: 'tnode leaf' }, h('span', { class: 'tkey' }, label), h('span', { class: 'ttype' }, n.t), inp);
  };
  const branch = (n, label, pathKey) => {
    const count = n.t === 'dict' ? n.m.size : n.v.length; const d = h('details', { class: 'tnode', open: S.rawOpen.has(pathKey) });
    const body = h('div', { class: 'tchildren' });
    const fillBody = (limit = 150) => {
      body.replaceChildren(); const entries = n.t === 'dict' ? [...n.m.entries()] : n.v.map((x, i) => [String(i), x]);
      entries.slice(0, limit).forEach(([k, v]) => { const pk = pathKey + '/' + k; body.append(v.t === 'dict' || v.t === 'arr' ? branch(v, k, pk) : scalar(v, pk, k)); });
      if (entries.length > limit) body.append(button('Show ' + Math.min(300, entries.length - limit) + ' more of ' + entries.length, () => fillBody(limit + 300), 'small'));
    };
    d.append(h('summary', null, h('span', { class: 'tkey' }, label), h('span', { class: 'ttype' }, n.t), h('span', { class: 'muted small' }, count + (count === 1 ? ' entry' : ' entries'))), body);
    if (d.open) fillBody();
    d.addEventListener('toggle', () => { if (d.open) { S.rawOpen.add(pathKey); if (!body.firstChild) fillBody(); } else S.rawOpen.delete(pathKey); });
    return d;
  };
  const fill = () => {
    host.replaceChildren(); const q = (S.rawQ || '').toLowerCase();
    for (const [k, v] of f.root.m) { if (q && !k.toLowerCase().includes(q)) continue; host.append(v.t === 'dict' || v.t === 'arr' ? branch(v, k, sel + '/' + k) : scalar(v, sel + '/' + k, k)); }
  };
  fill();
  return h('div', { class: 'page' }, pageHead('Raw data', 'Every value in the file, exactly as stored. Edits here follow the same undo and review as everywhere else.'),
    h('div', { class: 'toolbar' }, roots.length > 1 ? h('div', { class: 'chips' }, roots.map(k => chip(k === 'save' ? 'Save slot' : 'Settings', k === sel, () => { S.rawFile = k; renderMain(); }))) : null, filter),
    host);
}


/* ================= max everything ================= */
/* Caps from the WEBFISHING wiki (Upgrade Shop, Bait pages) and the in-game rank list (rank 50 = Voyager). */
const MAXV = { rod_power: 8, rod_speed: 5, rod_chance: 5, rod_luck: 5, max_bait: 50, buddy_level: 5, buddy_speed: 5, level: 50 };
function maxDialog() {
  const fk = 'save'; const o = { rod: true, bait: true, buddy: true, lures: true, level: true, cos: true, journal: true, quests: true, money: true, amt: 999999999 };
  const row = (key, label, desc) => h('label', { class: 'check big' }, h('input', { type: 'checkbox', checked: o[key], onchange: (e) => { o[key] = e.target.checked; } }), h('span', null, h('b', null, label), ' ', h('span', { class: 'muted small' }, desc)));
  const m = modal('Max everything', [
    h('p', { class: 'muted' }, 'Sets each item to the highest value the game itself allows. Untick anything you want to leave alone.'),
    row('rod', 'Rod upgrades', 'Power 8, reel speed 5, catch chance 5, luck 5'),
    row('bait', 'Bait', 'Carry limit 50, every bait licence unlocked and stocked to 50'),
    row('buddy', 'Fishing buddy', 'Speed 5 and quality 5'),
    row('lures', 'Lures', 'Every lure unlocked'),
    row('level', 'Level', 'Rank 50 (Voyager), the highest rank'),
    row('cos', 'Cosmetics', 'Every cosmetic unlocked'),
    row('journal', 'Journal', 'Every creature added with all six rarities'),
    row('quests', 'Quests', 'Repeating quests moved to the top tier (9)'),
    h('div', { class: 'row wrap' }, row('money', 'Money', 'The most the game shows:'), h('input', { type: 'number', value: o.amt, min: 0, 'aria-label': 'Money amount', style: { width: '140px' }, onchange: (e) => { o.amt = Math.max(0, parseFloat(e.target.value) || 0); } })),
    h('p', { class: 'muted small' }, 'Not touched: XP, loan and camp tier (buy camp tier 4 in the game shop; it is not stored in the save). After loading, catch one fish: the game re-checks your journal on a catch and only then unlocks the rod rewards.'),
    h('div', { class: 'row end' }, button('Cancel', () => m.close(), 'ghost'), button('Max it out', () => { m.close(); commit(fk, 'Max everything', () => {
      const r = S.files.save.root; const set = (k, v) => { const n = get(r, k); if (n) setNum(n, v); };
      if (o.rod) ['rod_power', 'rod_speed', 'rod_chance', 'rod_luck'].forEach(k => set(k, MAXV[k]));
      if (o.buddy) ['buddy_level', 'buddy_speed'].forEach(k => set(k, MAXV[k]));
      if (o.level) set('level', Math.max(MAXV.level, val(r, 'level') || 0));
      if (o.bait) {
        set('max_bait', MAXV.max_bait); const un = get(r, 'bait_unlocked'), inv = ensure(r, 'bait_inv', () => N.dict());
        for (const id of Object.keys(DB.baits)) { toggleInList(un, id, true); setNum(ensure(inv, id, () => N.int(0)), MAXV.max_bait); }
      }
      if (o.lures) { const un = get(r, 'lure_unlocked'); for (const id of Object.keys(DB.lures)) toggleInList(un, id, true); }
      if (o.cos) {
        const un = get(r, 'cosmetics_unlocked'); const have = new Set(un.v.map(x => x.v)); const cats = new Set(COS_SLOTS.map(x => x[2]));
        Object.keys(ITEMS).filter(k => cats.has(ITEMS[k].c) && !/test/.test(k) && !have.has(k)).forEach(k => un.v.push(N.str(k)));
      }
      if (o.journal) {
        const jr = get(r, 'journal');
        for (const sec of JOURNAL_SECTIONS) {
          const node = ensure(jr, sec.key, () => N.dict());
          for (const id of sectionIds(sec)) {
            let e = node.m.get(id); if (!e) { e = newEntry(1, 10, []); node.m.set(id, e); }
            const a = get(e, 'quality'); const have = a.v.map(x => x.v); for (let i = 0; i < 6; i++) if (!have.includes(i)) a.v.push(N.int(i));
          }
        }
      }
      if (o.quests) for (const q of get(r, 'quests').m.values()) if (questScalable(q) && val(q, 'tier') < QUEST_TOP_TIER) setQuestTier(q, QUEST_TOP_TIER);
      if (o.money) set('money', Math.min(999999999, o.amt));
    }); toast('Maxed. Review the changes before you download.'); }, 'primary'))]);
}

/* ================= boot ================= */
function boot() {
  const picker = $('#picker');
  picker.addEventListener('change', () => { if (picker.files.length) loadFiles([...picker.files]); picker.value = ''; });
  let depth = 0; const veil = $('#veil');
  window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { depth++; veil.classList.add('on'); } });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) veil.classList.remove('on'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); depth = 0; veil.classList.remove('on'); if (e.dataTransfer.files.length) loadFiles([...e.dataTransfer.files]); });
  window.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'radio';
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); const fk = S.view === 'settings' ? 'general' : 'save'; downloadFile(S.files[fk] ? fk : (S.files.save ? 'save' : 'general')); }
    else if (e.key === '/' && !typing) { const s = $('.search'); if (s) { e.preventDefault(); s.focus(); } }
  });
  window.addEventListener('beforeunload', (e) => { if (anyFile() && changeCount()) { e.preventDefault(); e.returnValue = ''; } });
  const tb = $('#theme'); const apply = (t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem('tb-theme', t); } catch (_) { } };
  try { const t = localStorage.getItem('tb-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) { }
  tb.addEventListener('click', () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); apply(cur === 'dark' ? 'light' : 'dark'); });
  render();
  window.__tb = { S, loadFiles, parseFile, serializeFile };
}
boot();
